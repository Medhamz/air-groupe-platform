<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{admin/fragments/layout :: head}"></th:block>
</head>
<body>

<div th:replace="~{admin/fragments/layout :: header}"></div>
<div th:replace="~{admin/fragments/layout :: sidebar}"></div>

<main class="admin-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 cyber-title text-gold mb-1"><i class="fas fa-star me-2"></i>Modération des Avis Clients</h1>
            <p class="text-muted mb-0">Validez ou supprimez les avis déposés par les utilisateurs.</p>
        </div>
        <a href="/admin/dashboard" class="btn btn-gold rounded-pill px-4">
            <i class="fas fa-arrow-left me-2"></i>Retour au Dashboard
        </a>
    </div>

    <!-- Tableau de gestion avec carte Cyber -->
    <div class="cyber-card">
        <div class="table-responsive">
            <table class="table table-admin align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-3">Client</th>
                    <th>Note</th>
                    <th>Commentaire</th>
                    <th>Date</th>
                    <th>Statut</th>
                    <th class="text-end pe-3">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rev : ${reviews}">
                    <td class="ps-3 fw-semibold">
                        <span class="text-white" th:text="${rev.clientName}">Nom</span><br>
                        <small class="text-muted fw-normal" th:text="${rev.email}">Email</small>
                    </td>
                    <td>
                            <span class="badge bg-dark text-warning border border-warning px-2 py-1">
                                <i class="fas fa-star me-1"></i><span th:text="${rev.rating}">5</span>/5
                            </span>
                    </td>
                    <td style="max-width: 300px;">
                        <p class="text-truncate mb-0 text-white-50" th:text="${rev.comment}" th:title="${rev.comment}"></p>
                    </td>
                    <td class="text-muted" th:text="${#temporals.format(rev.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                    <td>
                        <span th:if="${rev.approved}" class="badge bg-success-subtle text-success border border-success rounded-pill px-3 py-1">Approuvé</span>
                        <span th:unless="${rev.approved}" class="badge bg-warning-subtle text-warning border border-warning rounded-pill px-3 py-1">En attente</span>
                    </td>
                    <td class="text-end pe-3">
                        <div class="d-flex justify-content-end gap-2">
                            <form th:if="${!rev.approved}" th:action="@{/admin/avis/approve/{id}(id=${rev.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-success rounded-pill px-3">
                                    <i class="fas fa-check me-1"></i> Approuver
                                </button>
                            </form>
                            <form th:action="@{/admin/avis/delete/{id}(id=${rev.id})}" method="post" onsubmit="return confirm('Voulez-vous vraiment supprimer cet avis ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                    <i class="fas fa-trash me-1"></i> Supprimer
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${reviews == null or reviews.isEmpty()}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="fas fa-inbox fa-3x mb-3 d-block opacity-50"></i>
                        Aucun avis disponible dans la base de données.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{admin/fragments/layout :: scripts}"></div>

</body>
</html>
