<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administration - Gestion des Avis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold"><i class="fas fa-star text-warning me-2"></i>Modération des Avis Clients</h2>
            <p class="text-muted mb-0">Validez ou supprimez les avis déposés par les utilisateurs.</p>
        </div>
        <a href="/admin/dashboard" class="btn btn-outline-secondary rounded-pill"><i class="fas fa-arrow-left me-2"></i>Retour au Dashboard</a>
    </div>

    <!-- Tableau de gestion -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Client</th>
                        <th>Note</th>
                        <th>Commentaire</th>
                        <th>Date</th>
                        <th>Statut</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="rev : ${reviews}">
                        <td class="ps-4 fw-semibold">
                            <span th:text="${rev.clientName}">Nom</span><br>
                            <small class="text-muted fw-normal" th:text="${rev.email}">Email</small>
                        </td>
                        <td>
                                <span class="badge bg-warning text-dark">
                                    <i class="fas fa-star me-1"></i><span th:text="${rev.rating}">5</span>/5
                                </span>
                        </td>
                        <td style="max-width: 300px;">
                            <p class="text-truncate mb-0" th:text="${rev.comment}" th:title="${rev.comment}"></p>
                        </td>
                        <td th:text="${#temporals.format(rev.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                        <td>
                            <span th:if="${rev.approved}" class="badge bg-success-subtle text-success border border-success rounded-pill">Approuvé</span>
                            <span th:unless="${rev.approved}" class="badge bg-warning-subtle text-warning border border-warning rounded-pill">En attente</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-flex justify-content-end gap-2">
                                <form th:if="${!rev.approved}" th:action="@{/admin/avis/approve/{id}(id=${rev.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-success rounded-pill px-3">
                                        <i class="fas fa-check me-1"></i> Approuver
                                    </button>
                                </form>
                                <form th:action="@{/admin/avis/delete/{id}(id=${rev.id})}" method="post" onsubmit="return confirm('Voulez-vous vraiment supprimer cet avis ?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                        <i class="fas fa-trash me-1"></i> Supprimer
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${reviews == null or reviews.isEmpty()}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            Aucun avis disponible dans la base de données.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
