<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head}"></head>
<body>

<div th:replace="~{admin/fragments/layout :: header}"></div>
<div th:replace="~{admin/fragments/layout :: sidebar}"></div>

<div th:replace="~{admin/fragments/layout :: main(~{::#page-content})}">
    <div id="page-content" class="cyber-card">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 text-gold m-0">
                <i class="fas fa-newspaper me-2"></i>Gestion des Actualités
            </h1>
            <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#articleModal">
                <i class="fas fa-plus me-1"></i> Nouvelle actualité
            </button>
        </div>

        <div class="row g-4">
            <div class="col-md-6" th:each="article : ${articles}">
                <div class="cyber-card p-3 h-100 d-flex flex-column justify-content-between">
                    <div>
                        <div th:if="${article.imageUrl != null}" class="mb-3 text-center" style="height: 180px; overflow: hidden; border-radius: 8px;">
                            <img th:src="${article.imageUrl}" class="w-100 h-100" style="object-fit: cover;">
                        </div>
                        <span class="text-muted small" th:text="${#temporals.format(article.createdAt, 'dd/MM/yyyy HH:mm')}">15/03/2025</span>
                        <h4 class="text-gold mt-1" th:text="${article.title}">Titre</h4>
                        <p class="text-light" th:text="${article.summary}">Résumé</p>
                    </div>
                    <div class="d-flex justify-content-end mt-3">
                        <a th:href="@{/admin/actualites/delete/{id}(id=${article.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer cet article ?')">
                            <i class="fas fa-trash me-1"></i> Supprimer
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-12 text-center text-muted py-4" th:if="${articles == null or articles.isEmpty()}">
                Aucune actualité publiée pour le moment.
            </div>
        </div>

    </div>
</div>

<!-- MODAL ADD ARTICLE -->
<div class="modal fade" id="articleModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content style-cyber-modal" style="background: var(--cyber-bg); border: 1px solid var(--glass-border); color: #fff;">
            <div class="modal-header" style="border-bottom-color: var(--glass-border);">
                <h5 class="modal-title text-gold"><i class="fas fa-pen me-2"></i>Publier une actualité</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/actualites/add}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-gold">Titre de l'article</label>
                        <input type="text" name="title" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-gold">Résumé (affiché sur la carte)</label>
                        <textarea name="summary" class="form-control bg-dark text-light border-secondary" rows="2" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-gold">Image d'illustration (optionnelle)</label>
                        <input type="file" name="file" class="form-control bg-dark text-light border-secondary" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-gold">Contenu détaillé (optionnel)</label>
                        <textarea name="content" class="form-control bg-dark text-light border-secondary" rows="5"></textarea>
                    </div>
                </div>
                <div class="modal-footer" style="border-top-color: var(--glass-border);">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-gold">Publier</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
