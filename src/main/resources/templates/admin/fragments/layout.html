<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Afrique Équipements</title>

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js & VanillaTilt -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <!-- tsParticles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <style>
        :root {
            --cyber-gold: #d4af37;
            --cyber-gold-glow: rgba(212, 175, 55, 0.4);
            --cyber-blue: #00f0ff;
            --cyber-bg: #0a0e17;
            --glass-bg: rgba(16, 24, 39, 0.65);
            --glass-border: rgba(212, 175, 55, 0.25);
            --text-main: #e2e8f0;
        }

        body {
            background-color: var(--cyber-bg);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
        }

        #tsparticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* HEADER CYBER */
        .admin-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .admin-header .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--cyber-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cyber-gold-glow);
        }

        .sidebar-toggle {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--cyber-gold);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sidebar-toggle:hover {
            box-shadow: 0 0 15px var(--cyber-gold-glow);
            background: var(--glass-bg);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            font-weight: 600;
            color: #fff;
        }

        .btn-logout {
            color: #ff4757;
            text-decoration: none;
            padding: 6px 16px;
            border: 1px solid rgba(255, 71, 87, 0.4);
            border-radius: 20px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-logout:hover {
            background: rgba(255, 71, 87, 0.2);
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
            color: #fff;
        }

        /* SIDEBAR CYBER */
        .admin-sidebar {
            position: fixed;
            top: 70px;
            left: 0;
            bottom: 0;
            width: 260px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            z-index: 999;
            padding-top: 20px;
            transition: all 0.3s ease;
        }

        .admin-sidebar .sidebar-brand {
            padding: 15px 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: #8a99ad;
            letter-spacing: 1px;
        }

        .admin-sidebar .nav-link {
            color: #a0aec0;
            padding: 14px 25px;
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .admin-sidebar .nav-link:hover, .admin-sidebar .nav-link.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.15) 0%, transparent 100%);
            border-left-color: var(--cyber-gold);
            text-shadow: 0 0 8px var(--cyber-gold-glow);
        }

        .admin-sidebar .nav-link i {
            color: var(--cyber-gold);
            width: 20px;
        }

        /* MAIN LAYOUT */
        .admin-wrapper {
            position: relative;
            z-index: 1;
            margin-top: 70px;
            margin-left: 260px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        /* CYBER CARDS & GLASSMORPHISM */
        .cyber-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .text-gold { color: var(--cyber-gold) !important; }
        .btn-gold {
            background: var(--cyber-gold);
            color: #000;
            font-weight: 700;
            border: none;
        }
        .btn-gold:hover {
            background: #e5be3b;
            color: #000;
        }
        .table-admin {
            color: var(--text-main);
        }
        .table-admin th {
            border-bottom-color: var(--glass-border);
            color: var(--cyber-gold);
        }
        .table-admin td {
            border-bottom-color: rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div id="tsparticles"></div>

<!-- HEADER -->
<header class="admin-header" th:fragment="header">
    <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="brand">
            <i class="fas fa-cube me-2"></i> Afrique Équipements
        </div>
    </div>
    <div class="user-menu">
        <span class="user-name"><i class="fas fa-user-astronaut text-gold me-2"></i> Administrateur</span>
        <a href="/admin/logout" class="btn-logout"><i class="fas fa-power-off me-1"></i> Déconnexion</a>
    </div>
</header>

<!-- SIDEBAR -->
<aside class="admin-sidebar" id="sidebar" th:fragment="sidebar">
    <div class="sidebar-brand">SYSTEM CONTROL</div>
    <nav class="nav flex-column">
        <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/admin/dashboard')} ? 'active'" href="/admin/dashboard">
            <i class="fas fa-chart-pie"></i> Tableau de bord
        </a>
        <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/admin/services')} ? 'active'" href="/admin/services">
            <i class="fas fa-concierge-bell"></i> Services
        </a>
        <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/admin/actualites')} ? 'active'" href="/admin/actualites">
            <i class="fas fa-newspaper"></i> Actualités
        </a>
        <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/admin/galerie')} ? 'active'" href="/admin/galerie">
            <i class="fas fa-images"></i> Galerie
        </a>
        <a class="nav-link" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/admin/messages')} ? 'active'" href="/admin/messages">
            <i class="fas fa-envelope-open-text"></i> Messages
            <span class="badge bg-warning text-dark ms-auto" th:text="${unreadCount != null ? unreadCount : 0}">0</span>
        </a>
        <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 20px;">
        <a class="nav-link text-muted" href="/">
            <i class="fas fa-globe-africa"></i> Back to Site
        </a>
    </nav>
</aside>

<!-- MAIN CONTENT WRAPPER -->
<div th:fragment="main(viewContent)" class="admin-wrapper">
    <main>
        <th:block th:replace="${viewContent}" />
    </main>
</div>

<!-- SCRIPTS INTELLIGENTS -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (typeof tsParticles !== 'undefined') {
            tsParticles.load("tsparticles", {
                particles: {
                    number: { value: 40, density: { enable: true, value_area: 800 } },
                    color: { value: ["#d4af37", "#00f0ff", "#ffffff"] },
                    shape: { type: "circle" },
                    opacity: { value: 0.4, random: true },
                    size: { value: 3, random: true },
                    move: { enable: true, speed: 1, direction: "none", out_mode: "out" },
                    line_linked: { enable: true, distance: 150, color: "#d4af37", opacity: 0.15, width: 1 }
                },
                interactivity: { events: { onhover: { enable: true, mode: "grab" } } }
            });
        }

        document.getElementById('sidebarToggle')?.addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const wrapper = document.querySelector('.admin-wrapper');
            if(sidebar.style.transform === 'translateX(-260px)') {
                sidebar.style.transform = 'translateX(0)';
                if(wrapper) wrapper.style.marginLeft = '260px';
            } else {
                sidebar.style.transform = 'translateX(-260px)';
                if(wrapper) wrapper.style.marginLeft = '0';
            }
        });

        if (typeof VanillaTilt !== 'undefined') {
            VanillaTilt.init(document.querySelectorAll(".tilt-card"), {
                max: 12, speed: 400, glare: true, "max-glare": 0.2
            });
        }
    </script>
</div>
</body>
</html>
