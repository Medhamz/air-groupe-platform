<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Afrique équipements et services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ... vos styles existants ... */
    </style>
</head>
<body>
<!-- HEADER -->
<header class="admin-header">
    <button class="sidebar-toggle" id="sidebarToggle">
        <i class="fas fa-bars"></i>
    </button>
    <div class="brand">
        <i class="fas fa-cog"></i> Administration
    </div>
    <div class="user-menu">
        <span class="user-name"><i class="fas fa-user-circle"></i> Administrateur</span>
        <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
    </div>
</header>

<!-- SIDEBAR -->
<aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-mountain"></i> Afrique Équipements
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" href="/admin/dashboard" th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/admin/dashboard')} ? 'active' : ''">
            <i class="fas fa-tachometer-alt"></i> Tableau de bord
        </a>
        <a class="nav-link" href="/admin/services" th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/admin/services')} ? 'active' : ''">
            <i class="fas fa-concierge-bell"></i> Services
        </a>
        <a class="nav-link" href="/admin/messages" th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/admin/messages')} ? 'active' : ''">
            <i class="fas fa-envelope"></i> Messages
            <span class="badge" th:text="${unreadCount != null ? unreadCount : 0}">0</span>
        </a>
        <a class="nav-link" href="/admin/projects" th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/admin/projects')} ? 'active' : ''">
            <i class="fas fa-project-diagram"></i> Projets
        </a>
        <a class="nav-link" href="/admin/users" th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/admin/users')} ? 'active' : ''">
            <i class="fas fa-users"></i> Utilisateurs
        </a>
        <hr>
        <a class="nav-link" href="/">
            <i class="fas fa-arrow-left"></i> Retour au site
        </a>
    </nav>
</aside>

<!-- CONTENU PRINCIPAL -->
<main class="admin-content">
    <div th:fragment="content">
        <!-- Le contenu spécifique sera injecté ici -->
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        if (toggle && sidebar) {
            toggle.addEventListener('click', function() {
                sidebar.classList.toggle('open');
            });
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
