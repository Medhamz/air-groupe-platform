<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<aside th:fragment="sidebar" class="admin-sidebar">
    <nav class="nav flex-column">
        <a class="nav-link" href="/admin/dashboard" th:classappend="${#strings.equals(#httpServletRequest.requestURI, '/admin/dashboard')} ? 'active' : ''">
            <i class="fas fa-tachometer-alt"></i> Tableau de bord
        </a>
        <a class="nav-link" href="/admin/services" th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/admin/services')} ? 'active' : ''">
            <i class="fas fa-concierge-bell"></i> Services
        </a>
        <a class="nav-link" href="/admin/messages" th:classappend="${#strings.contains(#httpServletRequest.requestURI, '/admin/messages')} ? 'active' : ''">
            <i class="fas fa-envelope"></i> Messages
            <span class="badge bg-danger ms-2" th:text="${unreadCount}">0</span>
        </a>
        <a class="nav-link" href="/admin/projects">
            <i class="fas fa-project-diagram"></i> Projets
        </a>
        <a class="nav-link" href="/admin/users">
            <i class="fas fa-users"></i> Utilisateurs
        </a>
        <hr class="border-secondary">
        <a class="nav-link" href="/">
            <i class="fas fa-arrow-left"></i> Retour au site
        </a>
    </nav>
</aside>
</body>
</html>
