<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head}"></head>
<body>
<div th:replace="~{admin/fragments/layout :: content}">
    <div th:fragment="content">
        <h1 class="h2 mb-4">Tableau de bord</h1>

        <!-- Statistiques -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-icon"><i class="fas fa-concierge-bell"></i></span>
                    <div class="stat-number" th:text="${totalServices != null ? totalServices : 0}">0</div>
                    <div class="stat-label">Services</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="border-left-color: #28a745;">
                    <span class="stat-icon"><i class="fas fa-envelope"></i></span>
                    <div class="stat-number" th:text="${totalMessages != null ? totalMessages : 0}">0</div>
                    <div class="stat-label">Messages</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="border-left-color: #ffc107;">
                    <span class="stat-icon"><i class="fas fa-envelope-open"></i></span>
                    <div class="stat-number" th:text="${unreadMessages != null ? unreadMessages : 0}">0</div>
                    <div class="stat-label">Non lus</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="border-left-color: #17a2b8;">
                    <span class="stat-icon"><i class="fas fa-project-diagram"></i></span>
                    <div class="stat-number" th:text="${totalProjets != null ? totalProjets : 0}">0</div>
                    <div class="stat-label">Projets</div>
                </div>
            </div>
        </div>

        <!-- Message de diagnostic -->
        <div class="alert alert-success">
            ✅ Le tableau de bord s'affiche correctement. Les statistiques sont chargées.
        </div>

        <!-- Section simplifiée sans graphique ni #temporals -->
        <div class="card">
            <div class="card-header bg-white fw-bold">
                <i class="fas fa-info-circle me-2 text-gold"></i> Informations
            </div>
            <div class="card-body">
                <p class="mb-0">Bienvenue dans l'interface d'administration.</p>
                <p class="mb-0">Vous pouvez gérer les services et les messages via le menu de gauche.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
