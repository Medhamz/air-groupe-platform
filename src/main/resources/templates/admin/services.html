<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head}"></head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>
<div th:replace="~{admin/fragments/layout :: sidebar}"></div>
<main class="admin-content">
    <div class="container-fluid">
        <div th:fragment="content">
            <h1 class="h2 mb-3">Gestion des services</h1>
            <div class="d-flex justify-content-end mb-3">
                <a href="/admin/services/create" class="btn btn-gold btn-sm">
                    <i class="fas fa-plus"></i> Nouveau service
                </a>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Icône</th>
                        <th>Actif</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${services}">
                        <td th:text="${s.id}">1</td>
                        <td th:text="${s.name}">Service</td>
                        <td th:text="${s.description}">Description</td>
                        <td><i class="fas" th:class="${s.iconClass}"></i></td>
                        <td><span class="badge" th:class="${s.isActive} ? 'bg-success' : 'bg-secondary'" th:text="${s.isActive} ? 'Actif' : 'Inactif'"></span></td>
                        <td>
                            <a th:href="@{/admin/services/edit/{id}(id=${s.id})}" class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/admin/services/delete/{id}(id=${s.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer ce service ?')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${services.isEmpty()}">
                        <td colspan="6" class="text-center text-muted">Aucun service enregistré.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</body>
</html>
