<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head}"></head>
<body>

<div th:replace="~{admin/fragments/layout :: header}"></div>
<div th:replace="~{admin/fragments/layout :: sidebar}"></div>

<div th:replace="~{admin/fragments/layout :: main(~{::#page-content})}">
    <div id="page-content" class="cyber-card">
        <h1 class="h2 mb-4 text-gold" th:text="${service.id != null} ? 'Modifier un service' : 'Nouveau service'">Nouveau service</h1>

        <form th:action="@{/admin/services/save}" th:object="${service}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-bold">Nom</label>
                <input type="text" th:field="*{name}" class="form-control bg-dark text-white border-secondary" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea th:field="*{description}" class="form-control bg-dark text-white border-secondary" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Icône (classe FontAwesome)</label>
                <input type="text" th:field="*{iconClass}" class="form-control bg-dark text-white border-secondary" placeholder="ex: fa-hard-hat">
                <small class="text-muted">Voir <a href="https://fontawesome.com/icons" target="_blank" class="text-gold">FontAwesome</a> pour les icônes.</small>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Ordre d'affichage</label>
                <input type="number" th:field="*{displayOrder}" class="form-control bg-dark text-white border-secondary" min="0">
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" th:field="*{isActive}" class="form-check-input" id="active">
                <label class="form-check-label" for="active">Actif</label>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-gold">Enregistrer</button>
                <a href="/admin/services" class="btn btn-outline-light">Annuler</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
