<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head}"></head>
<body>

<div th:replace="~{admin/fragments/layout :: header}"></div>
<div th:replace="~{admin/fragments/layout :: sidebar}"></div>

<div th:replace="~{admin/fragments/layout :: main(~{::#page-content})}">
    <div id="page-content">

        <!-- En-tête de page & Cartes Métriques -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="h2 text-gold m-0 fw-bold">
                    <i class="fas fa-envelope-open-text me-2"></i>Gestion des messages
                </h1>
                <p class="text-muted small m-0">Consultez et répondez aux messages reçus depuis le site</p>
            </div>

            <div class="d-flex gap-3">
                <div class="cyber-card py-2 px-3 d-flex align-items-center gap-2">
                    <i class="fas fa-inbox text-gold"></i>
                    <span class="small text-white">Total : <strong th:text="${messages != null ? messages.size() : 0}">0</strong></span>
                </div>
                <div class="cyber-card py-2 px-3 d-flex align-items-center gap-2" style="border-color: rgba(255, 183, 3, 0.4);">
                    <i class="fas fa-bell text-warning"></i>
                    <span class="small text-white">Non lus : <strong th:text="${unreadCount != null ? unreadCount : 0}">0</strong></span>
                </div>
            </div>
        </div>

        <!-- Filtres et Recherche -->
        <div class="cyber-card mb-4 p-3">
            <div class="row g-3">
                <div class="col-md-6 col-lg-4">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-gold">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-secondary text-white bg-transparent" placeholder="Rechercher nom, email, sujet...">
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <select id="statusFilter" class="form-select border-secondary text-white" style="background-color: var(--cyber-bg);">
                        <option value="all">Tous les messages</option>
                        <option value="unread">Non lus uniquement</option>
                        <option value="read">Lus uniquement</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Table des Messages -->
        <div class="cyber-card p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-admin table-hover align-middle m-0" id="messagesTable">
                    <thead>
                    <tr>
                        <th class="ps-4">Expéditeur</th>
                        <th>Sujet</th>
                        <th>Téléphone</th>
                        <th>Statut</th>
                        <th>Date</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="msg : ${messages}"
                        class="message-row"
                        th:data-status="${msg.isRead != null and msg.isRead} ? 'read' : 'unread'"
                        th:style="${msg.isRead == null or !msg.isRead} ? 'background: rgba(212, 175, 55, 0.05);' : ''">

                        <!-- Expéditeur -->
                        <td class="ps-4 py-3">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-dark border border-warning text-gold d-flex align-items-center justify-content-center me-3" style="width: 38px; height: 38px; font-weight: bold;">
                                    <span th:text="${msg.name != null and !msg.name.isEmpty() ? #strings.substring(msg.name,0,1).toUpperCase() : '?'}">U</span>
                                </div>
                                <div>
                                    <div class="fw-bold text-white" th:text="${msg.name}">Nom Client</div>
                                    <div class="text-muted small" th:text="${msg.email}">email@example.com</div>
                                </div>
                            </div>
                        </td>

                        <!-- Sujet -->
                        <td>
                            <span class="text-truncate d-inline-block" style="max-width: 200px;" th:text="${msg.subject}">Sujet</span>
                        </td>

                        <!-- Téléphone -->
                        <td class="text-muted small" th:text="${msg.phone != null and !msg.phone.isEmpty() ? msg.phone : '-'}">-</td>

                        <!-- Statut -->
                        <td>
                                <span class="badge"
                                      th:classappend="${msg.isRead != null and msg.isRead} ? 'bg-success text-white' : 'bg-warning text-dark'"
                                      th:text="${msg.isRead != null and msg.isRead} ? 'Lu' : 'Nouveau'">Nouveau</span>
                        </td>

                        <!-- Date -->
                        <td class="text-muted small" th:text="${msg.createdAt != null ? #temporals.format(msg.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">Date</td>

                        <!-- Actions -->
                        <td class="text-end pe-4">
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-warning me-1"
                                        title="Lire le message"
                                        th:data-id="${msg.id}"
                                        th:data-name="${msg.name}"
                                        th:data-email="${msg.email}"
                                        th:data-phone="${msg.phone}"
                                        th:data-subject="${msg.subject}"
                                        th:data-message="${msg.message}"
                                        th:data-date="${msg.createdAt != null ? #temporals.format(msg.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"
                                        onclick="openMessageModal(this)">
                                    <i class="fas fa-eye"></i>
                                </button>

                                <a th:href="@{/admin/messages/read/{id}(id=${msg.id})}"
                                   class="btn btn-sm btn-outline-success me-1"
                                   th:unless="${msg.isRead}"
                                   title="Marquer comme lu">
                                    <i class="fas fa-check"></i>
                                </a>

                                <a th:href="@{/admin/messages/delete/{id}(id=${msg.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Confirmer la suppression de ce message ?')"
                                   title="Supprimer">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>

                    <!-- Boîte vide -->
                    <tr id="emptyRow" th:if="${messages == null or #lists.isEmpty(messages)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x mb-3 text-gold opacity-50"></i>
                            <p class="m-0">Aucun message disponible.</p>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Modal Visualisation & Réponse -->
<div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content cyber-card text-white border-warning">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-gold"><i class="fas fa-envelope-open me-2"></i>Détails du message</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <small class="text-muted d-block">Expéditeur</small>
                        <strong id="modalName" class="fs-5 text-white"></strong>
                        <div id="modalEmail" class="text-gold small"></div>
                        <div id="modalPhone" class="text-muted small"></div>
                    </div>
                    <div class="col-md-6 text-md-end mt-2 mt-md-0">
                        <small class="text-muted d-block">Reçu le</small>
                        <span id="modalDate" class="badge bg-dark border border-secondary text-white"></span>
                    </div>
                </div>
                <hr style="border-color: rgba(255,255,255,0.1);">
                <div class="mb-3">
                    <small class="text-muted d-block">Sujet</small>
                    <h6 id="modalSubject" class="fw-bold text-gold"></h6>
                </div>
                <div class="mb-3">
                    <small class="text-muted d-block mb-1">Contenu</small>
                    <div id="modalContent" class="p-3 rounded bg-dark text-light border border-secondary" style="white-space: pre-wrap; min-height: 120px;"></div>
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <a id="replyButton" href="#" class="btn btn-gold rounded-pill px-4">
                    <i class="fas fa-paper-plane me-2"></i>Répondre
                </a>
                <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Fermer</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: scripts}"></div>

<script>
    function openMessageModal(btn) {
        const name = btn.getAttribute('data-name');
        const email = btn.getAttribute('data-email');
        const phone = btn.getAttribute('data-phone');
        const subject = btn.getAttribute('data-subject');
        const message = btn.getAttribute('data-message');
        const date = btn.getAttribute('data-date');

        document.getElementById('modalName').textContent = name || '';
        document.getElementById('modalEmail').textContent = email || '';
        document.getElementById('modalPhone').textContent = phone ? "Tél: " + phone : '';
        document.getElementById('modalSubject').textContent = subject || '';
        document.getElementById('modalContent').textContent = message || '';
        document.getElementById('modalDate').textContent = date || '';
        document.getElementById('replyButton').href = "mailto:" + email + "?subject=Re: " + encodeURIComponent(subject || '');

        const modal = new bootstrap.Modal(document.getElementById('messageModal'));
        modal.show();
    }

    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const rows = document.querySelectorAll('.message-row');

        function filterTable() {
            const query = searchInput.value.toLowerCase();
            const status = statusFilter.value;

            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                const rowStatus = row.getAttribute('data-status');

                const matchesSearch = text.includes(query);
                const matchesStatus = (status === 'all') || (status === rowStatus);

                row.style.display = (matchesSearch && matchesStatus) ? '' : 'none';
            });
        }

        if (searchInput && statusFilter) {
            searchInput.addEventListener('input', filterTable);
            statusFilter.addEventListener('change', filterTable);
        }
    });
</script>
</body>
</html>
