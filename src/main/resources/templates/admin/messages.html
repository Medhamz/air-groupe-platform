<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head}"></head>
<body>
<div th:replace="~{admin/fragments/layout :: content}">
    <div th:fragment="content">
        <h1 class="h2 mb-3">Gestion des messages</h1>

        <div class="table-responsive">
            <table class="table table-admin table-hover">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Sujet</th>
                    <th>Lu</th>
                    <th>Date</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="msg : ${messages}">
                    <td th:text="${msg.id}">1</td>
                    <td th:text="${msg.name}">Nom</td>
                    <td th:text="${msg.email}">email</td>
                    <td th:text="${msg.subject}">Sujet</td>
                    <td>
                                <span class="badge" th:class="${msg.isRead} ? 'bg-success' : 'bg-warning'"
                                      th:text="${msg.isRead} ? 'Lu' : 'Non lu'">Non lu</span>
                    </td>
                    <td th:text="${#temporals.format(msg.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                    <td class="text-end">
                        <a th:href="@{/admin/messages/read/{id}(id=${msg.id})}" class="btn btn-sm btn-outline-success" th:unless="${msg.isRead}"><i class="fas fa-check"></i></a>
                        <a th:href="@{/admin/messages/delete/{id}(id=${msg.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer ce message ?')"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${messages.isEmpty()}">
                    <td colspan="7" class="text-center text-muted">Aucun message.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
