<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head}"></head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>
<div th:replace="~{admin/fragments/layout :: sidebar}"></div>
<main class="admin-content">
    <div class="container-fluid">
        <div th:fragment="content">
            <h1 class="h2 mb-3">Messages de contact</h1>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Sujet</th>
                        <th>Date</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="msg : ${messages}">
                        <td th:text="${msg.id}">1</td>
                        <td th:text="${msg.name}">Nom</td>
                        <td th:text="${msg.email}">email@exemple.com</td>
                        <td th:text="${msg.subject}">Sujet</td>
                        <td th:text="${#temporals.format(msg.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                        <td>
                            <span class="badge" th:class="${msg.isRead} ? 'bg-success' : 'bg-warning'" th:text="${msg.isRead} ? 'Lu' : 'Non lu'"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/messages/read/{id}(id=${msg.id})}" class="btn btn-sm btn-outline-primary" th:unless="${msg.isRead}"><i class="fas fa-check"></i></a>
                            <a th:href="@{/admin/messages/delete/{id}(id=${msg.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer ce message ?')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${messages.isEmpty()}">
                        <td colspan="7" class="text-center text-muted">Aucun message reçu.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</body>
</html>
