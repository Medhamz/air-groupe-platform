<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head}"></head>
<body>

<div th:replace="~{admin/fragments/layout :: header}"></div>
<div th:replace="~{admin/fragments/layout :: sidebar}"></div>

<div th:replace="~{admin/fragments/layout :: main(~{::#page-content})}">
    <div id="page-content">

        <!-- En-tête de page -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="h2 text-gold m-0 fw-bold">
                    <i class="fas fa-inbox me-2"></i>Messagerie & Support
                </h1>
                <p class="text-muted small m-0">Gérez vos communications client en temps réel</p>
            </div>

            <!-- Badges Statistiques -->
            <div class="d-flex gap-2">
                <div class="cyber-card py-2 px-3 text-center">
                    <span class="d-block text-muted style-micro">TOTAL</span>
                    <strong class="text-white fs-5" id="statTotal" th:text="${messages != null ? messages.size() : 0}">0</strong>
                </div>
                <div class="cyber-card py-2 px-3 text-center border-warning">
                    <span class="d-block text-warning style-micro">NON LUS</span>
                    <strong class="text-warning fs-5" id="statUnread" th:text="${unreadCount != null ? unreadCount : 0}">0</strong>
                </div>
            </div>
        </div>

        <!-- Application de Messagerie (2 Colonnes) -->
        <div class="row g-3" style="min-height: 70vh;">

            <!-- COLONNE GAUCHE : Liste des messages -->
            <div class="col-lg-5 col-xl-4">
                <div class="cyber-card p-3 h-100 d-flex flex-column">

                    <!-- Barre de Recherche -->
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-dark border-secondary text-gold">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control bg-dark border-secondary text-white" placeholder="Rechercher un contact, sujet...">
                    </div>

                    <!-- Filtres Rapides (Tabs) -->
                    <div class="nav nav-pills nav-fill bg-dark p-1 rounded mb-3 border border-secondary style-tabs">
                        <button class="nav-link active py-1 btn-sm text-gold" data-filter="all" onclick="filterMessages('all', this)">Tous</button>
                        <button class="nav-link py-1 btn-sm text-white" data-filter="unread" onclick="filterMessages('unread', this)">
                            Non lus (<span th:text="${unreadCount != null ? unreadCount : 0}">0</span>)
                        </button>
                    </div>

                    <!-- Liste Déroulante -->
                    <div class="message-list flex-grow-1 overflow-auto pe-1" style="max-height: 580px;">

                        <div th:each="msg : ${messages}"
                             class="message-item cyber-card p-3 mb-2 cursor-pointer transition-all"
                             th:data-id="${msg.id}"
                             th:data-name="${msg.name}"
                             th:data-email="${msg.email}"
                             th:data-phone="${msg.phone != null ? msg.phone : ''}"
                             th:data-subject="${msg.subject}"
                             th:data-message="${msg.message}"
                             th:data-date="${msg.createdAt != null ? #temporals.format(msg.createdAt, 'dd MMM yyyy à HH:mm') : '-'}"
                             th:data-read="${msg.isRead}"
                             th:classappend="${msg.isRead == null or !msg.isRead} ? 'unread-card' : ''"
                             onclick="selectMessage(this)">

                            <div class="d-flex justify-content-between align-items-start mb-1">
                                <div class="d-flex align-items-center gap-2">
                                    <div class="avatar-circle" th:text="${msg.name != null and !msg.name.isEmpty() ? #strings.substring(msg.name,0,1).toUpperCase() : '?'}">U</div>
                                    <span class="fw-bold text-white text-truncate" style="max-width: 130px;" th:text="${msg.name}">Nom</span>
                                </div>
                                <span class="small text-muted" style="font-size: 0.75rem;" th:text="${msg.createdAt != null ? #temporals.format(msg.createdAt, 'dd/MM') : ''}">Date</span>
                            </div>

                            <div class="fw-semibold text-gold small text-truncate mb-1" th:text="${msg.subject}">Sujet du message</div>
                            <p class="text-muted small m-0 text-truncate" style="font-size: 0.8rem;" th:text="${msg.message}">Aperçu du contenu...</p>
                        </div>

                        <!-- État vide -->
                        <div id="emptyList" th:if="${messages == null or #lists.isEmpty(messages)}" class="text-center py-5 text-muted">
                            <i class="fas fa-inbox fa-2x mb-2 text-gold opacity-50"></i>
                            <p class="small m-0">Aucun message trouvé.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLONNE DROITE : Vue détaillée du message -->
            <div class="col-lg-7 col-xl-8">
                <div class="cyber-card p-4 h-100 d-flex flex-column justify-content-between" id="detailPanel">

                    <!-- Placeholder au chargement -->
                    <div id="noSelection" class="h-100 d-flex flex-column align-items-center justify-content-center text-muted py-5">
                        <i class="fas fa-paper-plane fa-3x mb-3 text-gold opacity-25"></i>
                        <p>Sélectionnez un message dans la liste pour afficher la discussion</p>
                    </div>

                    <!-- Contenu du message (masqué par défaut) -->
                    <div id="selectedContent" class="d-none flex-grow-1 d-flex flex-column">

                        <!-- Header Message -->
                        <div class="d-flex justify-content-between align-items-start border-bottom border-secondary pb-3 mb-3">
                            <div>
                                <h4 class="text-gold fw-bold mb-1" id="detailSubject">Sujet</h4>
                                <div class="d-flex align-items-center gap-2">
                                    <strong class="text-white" id="detailName">Nom</strong>
                                    <span class="text-muted">&lt;<span id="detailEmail">email</span>&gt;</span>
                                    <span class="badge bg-dark border border-secondary text-gold" id="detailPhone"></span>
                                </div>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-dark text-muted mb-2 border border-secondary d-block" id="detailDate">Date</span>
                                <div class="btn-group">
                                    <a id="markReadBtn" href="#" class="btn btn-sm btn-outline-success" title="Marquer comme lu">
                                        <i class="fas fa-check"></i>
                                    </a>
                                    <a id="deleteBtn" href="#" class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer ce message ?')" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Body Message -->
                        <div class="flex-grow-1 mb-4">
                            <label class="text-muted style-micro mb-2">MESSAGE</label>
                            <div class="p-3 rounded bg-dark border border-secondary text-light leading-relaxed" id="detailBody" style="min-height: 180px; white-space: pre-wrap;">
                            </div>
                        </div>

                        <!-- Zone de Réponse Rapide -->
                        <div class="border-top border-secondary pt-3">
                            <label class="text-gold style-micro mb-2"><i class="fas fa-reply me-1"></i>RÉPONSE RAPIDE</label>
                            <div class="input-group">
                                <textarea id="replyText" class="form-control bg-dark text-white border-secondary" rows="2" placeholder="Saisissez votre réponse..."></textarea>
                                <button type="button" class="btn btn-gold px-4" onclick="sendQuickReply()">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<div th:replace="~{admin/fragments/layout :: scripts}"></div>

<style>
    .cursor-pointer { cursor: pointer; }
    .transition-all { transition: all 0.2s ease; }
    .style-micro { font-size: 0.68rem; letter-spacing: 1px; font-weight: bold; }

    .unread-card {
        border-left: 3px solid var(--bs-warning, #ffc107) !important;
        background: rgba(212, 175, 55, 0.05);
    }

    .message-item:hover {
        border-color: rgba(212, 175, 55, 0.5) !important;
        transform: translateX(3px);
    }

    .message-item.active {
        border-color: #d4af37 !important;
        background: rgba(212, 175, 55, 0.12) !important;
    }

    .avatar-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #111;
        border: 1px solid #d4af37;
        color: #d4af37;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.85rem;
    }
</style>

<script>
    let activeEmail = '';
    let activeSubject = '';

    function selectMessage(element) {
        document.querySelectorAll('.message-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        const id = element.getAttribute('data-id');
        const name = element.getAttribute('data-name');
        activeEmail = element.getAttribute('data-email');
        const phone = element.getAttribute('data-phone');
        activeSubject = element.getAttribute('data-subject');
        const message = element.getAttribute('data-message');
        const date = element.getAttribute('data-date');
        const isRead = element.getAttribute('data-read') === 'true';

        document.getElementById('noSelection').classList.add('d-none');
        document.getElementById('selectedContent').classList.remove('d-none');

        document.getElementById('detailName').textContent = name;
        document.getElementById('detailEmail').textContent = activeEmail;
        document.getElementById('detailSubject').textContent = activeSubject;
        document.getElementById('detailBody').textContent = message;
        document.getElementById('detailDate').textContent = date;

        const phoneBadge = document.getElementById('detailPhone');
        if(phone) {
            phoneBadge.textContent = "Tél: " + phone;
            phoneBadge.classList.remove('d-none');
        } else {
            phoneBadge.classList.add('d-none');
        }

        document.getElementById('deleteBtn').href = `/admin/messages/delete/${id}`;

        const markReadBtn = document.getElementById('markReadBtn');
        if(!isRead) {
            markReadBtn.href = `/admin/messages/read/${id}`;
            markReadBtn.classList.remove('d-none');
        } else {
            markReadBtn.classList.add('d-none');
        }
    }

    function filterMessages(type, btn) {
        if(btn) {
            document.querySelectorAll('.style-tabs .nav-link').forEach(b => {
                b.classList.remove('active', 'text-gold');
                b.classList.add('text-white');
            });
            btn.classList.add('active', 'text-gold');
            btn.classList.remove('text-white');
        }

        const items = document.querySelectorAll('.message-item');
        items.forEach(item => {
            const isRead = item.getAttribute('data-read') === 'true';
            if (type === 'all') {
                item.style.display = 'block';
            } else if (type === 'unread') {
                item.style.display = !isRead ? 'block' : 'none';
            }
        });
    }

    function sendQuickReply() {
        const text = document.getElementById('replyText').value;
        if (!text) return;

        const mailtoUrl = `mailto:${activeEmail}?subject=Re: ${encodeURIComponent(activeSubject)}&body=${encodeURIComponent(text)}`;
        window.location.href = mailtoUrl;
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();
        document.querySelectorAll('.message-item').forEach(item => {
            const text = item.innerText.toLowerCase();
            item.style.display = text.includes(query) ? 'block' : 'none';
        });
    });
</script>

</body>
</html>
