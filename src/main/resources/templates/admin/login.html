<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - Afrique Équipements</title>

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Typographies Cyber -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Scripts pour Effet 3D Tilt & Particules Lumineuses -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <style>
        :root {
            --cyber-gold: #d4af37;
            --cyber-gold-glow: rgba(212, 175, 55, 0.5);
            --cyber-blue: #00f0ff;
            --cyber-bg: #0a0e17;
            --glass-bg: rgba(16, 24, 39, 0.75);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-main: #e2e8f0;
        }

        body {
            background-color: var(--cyber-bg);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* FOND DE PARTICULES */
        #tsparticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* CONTAINER DE LOGIN GLASSMORPHISM 3D */
        .login-card {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 90%;
            padding: 45px 35px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                        0 0 15px rgba(212, 175, 55, 0.15);
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* HALO LUMINEUX ARRIÈRE-PLAN */
        .login-card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--cyber-gold), transparent, var(--cyber-blue));
            border-radius: 25px;
            z-index: -1;
            opacity: 0.3;
            transition: opacity 0.5s ease;
        }

        .login-card:hover::after {
            opacity: 0.7;
        }

        /* HEADER / LOGO ANIMÉ */
        .logo-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--cyber-gold-glow);
            animation: pulse-glow 3s infinite ease-in-out;
        }

        .logo-icon-wrapper i {
            font-size: 2.2rem;
            color: var(--cyber-gold);
            filter: drop-shadow(0 0 8px var(--cyber-gold-glow));
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px var(--cyber-gold-glow); transform: scale(1); }
            50% { box-shadow: 0 0 30px var(--cyber-gold-glow), 0 0 10px var(--cyber-blue); transform: scale(1.05); }
        }

        .logo-box h4 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .logo-box p {
            color: var(--cyber-gold);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            margin: 0;
            opacity: 0.8;
        }

        /* FORMULAIRE CYBER */
        .form-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .input-group {
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--cyber-gold);
            box-shadow: 0 0 12px var(--cyber-gold-glow);
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: var(--cyber-gold);
            padding-left: 15px;
        }

        .form-control {
            background: transparent;
            border: none;
            color: #fff;
            padding: 12px 15px;
            font-size: 1rem;
        }

        .form-control:focus {
            background: transparent;
            color: #fff;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #475569;
        }

        /* BOUTON FUTURISTE */
        .btn-cyber {
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #0a0e17;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--cyber-gold-glow);
            margin-top: 10px;
        }

        .btn-cyber:hover {
            background: linear-gradient(135deg, #f1c40f 0%, #d4af37 100%);
            box-shadow: 0 0 25px var(--cyber-gold-glow);
            color: #000;
            transform: translateY(-2px);
        }

        /* ALERTS */
        .alert-cyber {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            border-radius: 12px;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
        }

        .alert-cyber-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            border-radius: 12px;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
        }

        /* LIEN RETOUR */
        .back-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .back-link:hover {
            color: var(--cyber-blue);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

<!-- PARTICULES LUMINEUSES EN ARRIÈRE-PLAN -->
<div id="tsparticles"></div>

<!-- CARTE DE CONNEXION 3D TILT -->
<div class="login-card tilt-card">
    <div class="logo-box">
        <div class="logo-icon-wrapper">
            <i class="fas fa-shield-halved"></i>
        </div>
        <h4>Afrique Équipements</h4>
        <p><i class="fas fa-lock me-1"></i> Espace Sécurisé</p>
    </div>

    <!-- NOTIFICATION D'ERREUR -->
    <div th:if="${param.error}" class="alert alert-cyber text-center mb-4">
        <i class="fas fa-exclamation-triangle me-2"></i> Identifiants incorrects.
    </div>

    <!-- NOTIFICATION DE DÉCONNEXION -->
    <div th:if="${param.logout}" class="alert alert-cyber-success text-center mb-4">
        <i class="fas fa-check-circle me-2"></i> Déconnexion réussie.
    </div>

    <!-- FORMULAIRE -->
    <form th:action="@{/admin/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user-astronaut"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Entrez votre identifiant" required autofocus autocomplete="off">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-key"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-cyber w-100">
            <i class="fas fa-sign-in-alt me-2"></i> Connexion
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="/" class="back-link">
            <i class="fas fa-arrow-left me-1"></i> Retour au site public
        </a>
    </div>
</div>

<!-- SCRIPTS D'ANIMATION -->
<script>
    // Configuration des Particules Lumineuses
    tsParticles.load("tsparticles", {
        particles: {
            number: { value: 50, density: { enable: true, value_area: 800 } },
            color: { value: ["#d4af37", "#00f0ff", "#ffffff"] },
            shape: { type: "circle" },
            opacity: { value: 0.5, random: true },
            size: { value: 3, random: true },
            move: {
                enable: true,
                speed: 1.2,
                direction: "none",
                out_mode: "out"
            },
            line_linked: {
                enable: true,
                distance: 140,
                color: "#d4af37",
                opacity: 0.15,
                width: 1
            }
        },
        interactivity: {
            events: { onhover: { enable: true, mode: "grab" } }
        }
    });

    // Activation de l'Effet 3D Tilt au survol
    VanillaTilt.init(document.querySelector(".tilt-card"), {
        max: 10,
        speed: 400,
        glare: true,
        "max-glare": 0.15
    });
</script>

</body>
</html>
