<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Admin - Afrique Équipements et Services</title>

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Typographies Cyber -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Scripts pour Effet 3D & Particules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <style>
        :root {
            --cyber-gold: #d4af37;
            --cyber-gold-glow: rgba(212, 175, 55, 0.5);
            --cyber-blue: #00f0ff;
            --cyber-bg: #0a0e17;
            --glass-bg: rgba(16, 24, 39, 0.75);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-main: #e2e8f0;
        }

        body {
            background-color: var(--cyber-bg);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        #tsparticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* CARTE DE BIENVENUE GLASSMORPHISM */
        .welcome-card {
            position: relative;
            z-index: 1;
            max-width: 550px;
            width: 90%;
            padding: 50px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(212, 175, 55, 0.15);
            text-align: center;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .welcome-card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--cyber-gold), transparent, var(--cyber-blue));
            border-radius: 25px;
            z-index: -1;
            opacity: 0.3;
            transition: opacity 0.5s ease;
        }

        .welcome-card:hover::after {
            opacity: 0.7;
        }

        /* LOGO & SYMBOLE ANIMÉ */
        .brand-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--cyber-gold);
            border-radius: 50px;
            color: var(--cyber-gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .welcome-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--cyber-gold-glow);
            animation: pulse-glow 3s infinite ease-in-out;
        }

        .welcome-icon i {
            font-size: 2.8rem;
            color: var(--cyber-gold);
            filter: drop-shadow(0 0 10px var(--cyber-gold-glow));
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px var(--cyber-gold-glow); transform: scale(1); }
            50% { box-shadow: 0 0 35px var(--cyber-gold-glow), 0 0 15px var(--cyber-blue); transform: scale(1.05); }
        }

        .welcome-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* BADGES D'INFORMATION SÉCURITÉ */
        .info-pills {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        .pill-item {
            font-size: 0.8rem;
            color: #cbd5e1;
            background: rgba(10, 14, 23, 0.6);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .pill-item i {
            color: var(--cyber-blue);
            margin-right: 6px;
        }

        /* BOUTON D'ACCÈS FUTURISTE */
        .btn-enter {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #0a0e17;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--cyber-gold-glow);
        }

        .btn-enter:hover {
            background: linear-gradient(135deg, #f1c40f 0%, #d4af37 100%);
            box-shadow: 0 0 30px var(--cyber-gold-glow);
            color: #000;
            transform: translateY(-2px);
        }

        .back-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 25px;
        }

        .back-link:hover {
            color: var(--cyber-blue);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

<div id="tsparticles"></div>

<div class="welcome-card tilt-card">
    <div class="brand-badge">
        <i class="fas fa-microchip me-1"></i> System v2.4
    </div>

    <div class="welcome-icon">
        <i class="fas fa-building-shield"></i>
    </div>

    <h1 class="welcome-title">Afrique Équipements<br>& Services</h1>
    <p class="welcome-subtitle">Portail de gestion d'entreprise sécurisé. Veuillez vous authentifier pour accéder au panneau de contrôle.</p>

    <div class="info-pills">
        <div class="pill-item"><i class="fas fa-lock"></i> Chiffrement SSL</div>
        <div class="pill-item"><i class="fas fa-user-shield"></i> Accès Restreint</div>
    </div>

    <a href="/admin/login" class="btn-enter">
        <i class="fas fa-key me-2"></i> Accéder au système
    </a>

    <div>
        <a href="/" class="back-link">
            <i class="fas fa-arrow-left me-1"></i> Retour au site web
        </a>
    </div>
</div>

<script>
    // Particules
    tsParticles.load("tsparticles", {
        particles: {
            number: { value: 50, density: { enable: true, value_area: 800 } },
            color: { value: ["#d4af37", "#00f0ff", "#ffffff"] },
            shape: { type: "circle" },
            opacity: { value: 0.5, random: true },
            size: { value: 3, random: true },
            move: { enable: true, speed: 1.2, direction: "none", out_mode: "out" },
            line_linked: { enable: true, distance: 140, color: "#d4af37", opacity: 0.15, width: 1 }
        },
        interactivity: { events: { onhover: { enable: true, mode: "grab" } } }
    });

    // Effet 3D Tilt
    VanillaTilt.init(document.querySelector(".tilt-card"), {
        max: 10,
        speed: 400,
        glare: true,
        "max-glare": 0.15
    });
</script>

</body>
</html>
