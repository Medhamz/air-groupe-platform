<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/layout :: head}"></head>
<body>
<div th:replace="~{front/fragments/layout :: navbar}"></div>

<section class="py-5 section-animate">
    <div class="container">
        <h1 class="text-center section-title">Nos Services</h1>
        <p class="text-center section-subtitle">Découvrez l'ensemble de nos prestations de qualité.</p>

        <!-- Barre de recherche -->
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-search"></i></span>
                    <input type="text" id="serviceSearch" class="form-control border-start-0" placeholder="Rechercher un service...">
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4" th:each="s : ${services}">
                <div class="service-card p-4">
                    <div class="icon-wrapper"><i class="fas" th:class="${s.iconClass}"></i></div>
                    <h5 class="card-title" th:text="${s.name}">Nom du service</h5>
                    <p class="card-text" th:text="${s.description}">Description détaillée du service.</p>
                    <span class="service-tag"><i class="fas fa-check-circle me-1"></i> Disponible</span>
                </div>
            </div>
            <div th:if="${services.isEmpty()}" class="col-12 text-center py-5">
                <i class="fas fa-box-open" style="font-size: 4rem; color: var(--gray);"></i>
                <p class="text-secondary mt-3">Aucun service enregistré pour le moment.</p>
                <p class="text-muted small">Veuillez en ajouter via l'interface d'administration.</p>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{front/fragments/layout :: footer}"></div>
<div th:replace="~{front/fragments/layout :: scripts}"></div>
</body>
</html>
