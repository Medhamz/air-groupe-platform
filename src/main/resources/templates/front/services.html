<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nos Services - Aïr Groupe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"> ... </nav>
<div class="container py-5">
    <h1 class="text-center mb-5">Tous nos services</h1>
    <div class="row">
        <div class="col-md-4 mb-4" th:each="s : ${services}">
            <div class="card h-100">
                <div class="card-body">
                    <i class="fas fa-3x mb-3" th:class="${s.iconClass}"></i>
                    <h5 th:text="${s.name}"></h5>
                    <p th:text="${s.description}"></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
