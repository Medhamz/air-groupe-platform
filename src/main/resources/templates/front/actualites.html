<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/layout :: head}"></head>
<body>
<div th:replace="~{front/fragments/layout :: navbar}"></div>

<section class="py-5 section-animate">
    <div class="container">
        <h1 class="text-center section-title">Actualités</h1>
        <p class="text-center text-secondary mb-5" style="font-size:1.2rem;">Suivez l'actualité d'Afrique équipements et services à Agadez.</p>

        <div class="row g-4">
            <div class="col-md-4" th:each="article : ${articles}">
                <div class="article-card h-100 d-flex flex-column justify-content-between">
                    <div class="article-body">
                        <div th:if="${article.imageUrl != null}" class="mb-3 text-center" style="height: 180px; overflow: hidden; border-radius: 8px;">
                            <img th:src="${article.imageUrl}" class="w-100 h-100" style="object-fit: cover;" th:alt="${article.title}">
                        </div>
                        <p class="date">
                            <i class="far fa-calendar-alt me-2"></i>
                            <span th:if="${article.createdAt != null}"
                                  th:text="${#temporals.format(article.createdAt, 'dd MMMM yyyy')}">15 mars 2025</span>
                        </p>
                        <h5 th:text="${article.title}">Titre de l'article</h5>
                        <p th:text="${article.summary}">Résumé de l'actualité...</p>
                    </div>
                </div>
            </div>

            <!-- Message si aucune actualité -->
            <div class="col-12 text-center text-muted py-5" th:if="${articles == null or articles.isEmpty()}">
                <i class="far fa-newspaper fa-3x mb-3 text-secondary"></i>
                <p class="fs-5">Aucune actualité publiée pour le moment.</p>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{front/fragments/layout :: footer}"></div>
<div th:replace="~{front/fragments/layout :: scripts}"></div>
</body>
</html>
