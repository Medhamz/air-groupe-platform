<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/layout :: head}"></head>
<body>

<!-- Navigation (fragment) -->
<div th:replace="~{front/fragments/layout :: navbar}"></div>

<!-- Hero -->
<section class="hero text-center">
    <div class="container">
        <h1 class="display-3 fw-bold">Bienvenue chez Aïr Groupe</h1>
        <p class="lead">Leader au Niger dans les services intégrés : infrastructure, logistique et solutions modernes.</p>
        <a href="/services" class="btn btn-primary btn-lg mt-3">Découvrir nos services</a>
    </div>
</section>

<!-- Services aperçu -->
<section class="py-5">
    <div class="container">
        <h2 class="text-center mb-5">Nos Domaines d'Excellence</h2>
        <div class="row g-4">
            <div class="col-md-3" th:each="s : ${services}">
                <div class="card service-card h-100 text-center p-3">
                    <div class="card-body">
                        <i class="fas fa-2x mb-3" th:class="${s.iconClass}"></i>
                        <h5 class="card-title" th:text="${s.name}">Service</h5>
                        <p class="card-text" th:text="${s.description}">Description</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer (fragment) -->
<div th:replace="~{front/fragments/layout :: footer}"></div>

<!-- Scripts (fragment) -->
<div th:replace="~{front/fragments/layout :: scripts}"></div>

</body>
</html>
