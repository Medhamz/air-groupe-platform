<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/layout :: head}"></head>
<body>
<div th:replace="~{front/fragments/layout :: navbar}"></div>

<section class="py-5 section-animate">
    <div class="container">
        <h1 class="text-center section-title">Notre Équipe</h1>
        <p class="text-center text-secondary mb-5" style="font-size:1.2rem;">Des professionnels dévoués à votre service.</p>

        <div class="row g-4">
            <!-- Boucle dynamique sur la liste des membres -->
            <div class="col-md-3 col-sm-6" th:each="member : ${members}">
                <div class="team-card">
                    <div class="avatar" th:text="${member.initials}">AT</div>
                    <h5 th:text="${member.name}">Nom Membre</h5>
                    <p class="role" th:text="${member.role}">Poste</p>
                </div>
            </div>

            <!-- Message d'absence de membre -->
            <div th:if="${#lists.isEmpty(members)}" class="col-12 text-center py-5">
                <p class="text-muted fs-5">Aucun membre d'équipe enregistré pour le moment.</p>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{front/fragments/layout :: footer}"></div>
<div th:replace="~{front/fragments/layout :: scripts}"></div>
</body>
</html>
