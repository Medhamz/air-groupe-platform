<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/layout :: head}"></head>
<body>
<div th:replace="~{front/fragments/layout :: navbar}"></div>

<section class="py-5 section-animate">
    <div class="container">
        <h1 class="text-center section-title">Nos Projets</h1>
        <p class="text-center text-secondary mb-5" style="font-size:1.2rem;">Découvrez nos réalisations à Agadez et dans tout le Niger.</p>

        <div class="row g-4">
            <!-- Boucle dynamique sur les projets du back-office -->
            <div class="col-md-4" th:each="proj : ${projects}">
                <div class="project-card">
                    <div class="project-body" style="padding: 30px 20px; text-align: center;">
                        <h5 th:text="${proj.title}">Titre</h5>
                        <p th:text="${proj.description}" class="small mb-0">Description</p>
                    </div>
                </div>
            </div>

            <!-- Affichage propre si la liste est vide -->
            <div th:if="${#lists.isEmpty(projects)}" class="col-12 text-center py-5">
                <p class="text-muted fs-5">Aucun projet à afficher pour le moment.</p>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{front/fragments/layout :: footer}"></div>
<div th:replace="~{front/fragments/layout :: scripts}"></div>
</body>
</html>
