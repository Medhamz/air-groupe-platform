<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/layout :: head}"></head>
<body>
<div th:replace="~{front/fragments/layout :: navbar}"></div>

<section class="py-5 section-animate">
    <div class="container">
        <h1 class="text-center section-title">Nos Réalisations</h1>
        <p class="text-center text-secondary mb-4" style="font-size:1.2rem;">Quelques-uns de nos projets récents.</p>

        <!-- Filtres -->
        <div class="filter-buttons text-center mb-4">
            <button class="btn active filter-btn" data-filter="all">Tous</button>
            <button class="btn filter-btn" data-filter="infrastructure">Infrastructure</button>
            <button class="btn filter-btn" data-filter="agricole">Agricole</button>
            <button class="btn filter-btn" data-filter="location">Location d'engins</button>
        </div>

        <div class="row g-4" id="projectsList">
            <div class="col-md-4 project-card" data-category="infrastructure" th:each="proj : ${projects}">
                <img th:src="${proj.imageUrl}" alt="Projet" class="img-fluid" th:alt="${proj.title}">
                <div class="overlay">
                    <h5 th:text="${proj.title}">Titre</h5>
                    <p th:text="${proj.description}" class="small mb-0">Description</p>
                </div>
            </div>
            <div th:if="${projects.isEmpty()}" class="col-12 text-center">
                <p class="text-secondary">Aucune réalisation à afficher pour le moment.</p>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{front/fragments/layout :: footer}"></div>
<div th:replace="~{front/fragments/layout :: scripts}"></div>
</body>
</html>
