# Server
server.port=8080

# Database (PostgreSQL)
# En local, vous devez avoir PostgreSQL installé ou utilisez H2 en mémoire pour tester.
# Je vous conseille d'installer PostgreSQL localement avec le user=postgres, password=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/air_groupe_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Flyway (gère les migrations SQL)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf (cache off pour le développement)
spring.thymeleaf.cache=false

# Security (configuration de l'admin par défaut - on fera via la BDD)
# On définit un compte admin par défaut via la base de données (voir Flyway)