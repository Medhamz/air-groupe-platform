server.port=${PORT:8080}

# ========== BASE DE DONNÉES ==========
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ========== FLYWAY & THYMELEAF ==========
spring.flyway.enabled=false
spring.thymeleaf.cache=false

# ========== SUPPORT DE RENDER & REVERSE PROXY (Règle le problème 404 / SSL) ==========
# Transmet le protocole HTTPS et l'hôte d'origine depuis le proxy Render vers Spring Boot
server.forward-headers-strategy=framework

# Souplesse de correspondance des URLs (évite les erreurs 404 liées aux slashes de fin "/")
spring.mvc.pathmatch.matching-strategy=ant_path_matcher