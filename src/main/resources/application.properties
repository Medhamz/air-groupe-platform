server.port=${PORT:8080}

# ========== BASE DE DONNÉES ==========
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ========== FLYWAY & THYMELEAF ==========
spring.flyway.enabled=false
spring.thymeleaf.cache=false

# ========== SUPPORT DE RENDER & REVERSE PROXY (Règle le problème 404 / SSL) ==========
# Transmet le protocole HTTPS et l'hôte d'origine depuis le proxy Render vers Spring Boot
server.forward-headers-strategy=framework

# Souplesse de correspondance des URLs (évite les erreurs 404 liées aux slashes de fin "/")
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Taille maximale pour un fichier individuel (ex: une vidéo de 20MB)
spring.servlet.multipart.max-file-size=20MB

# Taille maximale totale pour l'ensemble de la requête
spring.servlet.multipart.max-request-size=25MB

# Configuration SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sidimohamedhamza2@gmail.com
# Ne mettez PAS votre vrai mot de passe Gmail ici.
# Créez un "Mot de passe d'application" dans votre compte Google (Sécurité > Validation en 2 étapes > Mots de passe d'application)
spring.mail.password=qynq zzcz xnke muwu
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.security=DEBUG
logging.level.com.airgroupe.platform=DEBUG

# ========== AJOUTS RECOMMANDÉS ==========

# Timeouts SMTP (évite que l'envoi d'email bloque la requête HTTP si Gmail est lent)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Encodage UTF-8 pour les emails (accents français, arabe...)
spring.mail.default-encoding=UTF-8

# Sécurité : ne pas exposer les stack traces en production
server.error.include-message=always
server.error.include-binding-errors=always

# Logging moins verbeux (retirez DEBUG en prod, sinon les logs Render explosent)
# logging.level.org.springframework.security=DEBUG  ? à commenter en prod

# ========== BASE DE DONNÉES ? paramètres recommandés ==========
# À ajouter pour éviter les déconnexions Render
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ========== VERSION APP MOBILE ==========
app.version.name=1.0.2
app.version.code=3
app.version.apk-url=https://www.aes-sarlu.com/telechargement/aes-sarlu-pro.apk
app.version.release-notes=Version initiale.
app.version.force-update=false