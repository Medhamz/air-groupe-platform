# Server
server.port=${PORT:8080}

# Base de données : utilise les variables Spring standard
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/air_groupe_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Flyway (actif par défaut, mais peut être désactivé via profil)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false